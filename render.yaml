services:
  - type: web
    name: skill-trading
    env: node
    region: singapore
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm install && npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: skill-trading-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: ""

databases:
  - name: skill-trading-db
    databaseName: skilltrading
    user: skilltrading
    plan: free
    region: singapore
