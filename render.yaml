services:
  - type: web
    name: skill-trading
    env: node
    region: singapore
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm install && npm run render-build
    startCommand: npm start
    disk:
      name: skill-trading-sqlite
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:/data/dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: ""
