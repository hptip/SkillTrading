services:
  - type: web
    name: skill-trading
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: skill-trading-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://skill-trading.onrender.com

databases:
  - name: skill-trading-db
    plan: free
    region: singapore
    databaseName: skilltrading
    user: skilltrading_user
