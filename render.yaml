services:
  - type: web
    name: skill-trading
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: skill-trading-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: skill-trading-db
    plan: free
    region: singapore
    databaseName: skilltrading
    user: skilltrading_user
